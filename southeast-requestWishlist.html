<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit an equipment wishlist request for the Southeast location via Will Clinic Hub.">
    <meta name="application-name" content="Will Clinic Hub">
    <meta name="author" content="Will">
    <meta property="og:title" content="Equipment Wishlist — Southeast | Will Clinic Hub">
    <meta property="og:description" content="Request new equipment for the Southeast location.">
    <title>Equipment Wishlist — Southeast | Will Clinic Hub</title>



    <link rel="icon" href="/will/assets/logo.png" type="image/png">
    <link rel="manifest" href="/will/assets/manifest-jx2tHeoB.json">
    <link rel="apple-touch-icon" href="/will/assets/logo.png">
  <script type="module" crossorigin src="/will/assets/scripts-CC4F18fF.js"></script>
  <link rel="stylesheet" crossorigin href="/will/assets/scripts-DBH1DUSb.css">
  <link rel="stylesheet" crossorigin href="/will/assets/scrollbar-B5V2Wh3s.css">
  <link rel="stylesheet" crossorigin href="/will/assets/forms-Cw21zwpd.css">
  <link rel="stylesheet" crossorigin href="/will/assets/recentItemsList-OE3pRblK.css">
</head>
<body>
    <header>
        <a href="/will/">
            <img src="/will/assets/logo.svg" alt="Primary Logo" class="logo">
        </a>
        <span class="location-badge">Southeast</span>
   </header>

    <main>
        <section class="recent-requests-section">
            <h2>Recent Wishlist Requests</h2>
            <div id="recentRequestsList" class="recent-items-list-container">
                <p>Loading recent requests...</p> <!-- Initial message -->
            </div>
        </section>

        <section class="request-form-section">
            <div class="collapse-button-container">
                <button class="collapse-button blue-button" id="toggleOpenFormButton" data-target="openForm">
                    Start Wishlist Request
                </button>
                <div id="openForm" class="collapse-content">
                    <form id="wishlistRequestForm" class="styled-form">
                        <div class="form-group">
                            <label for="submitterName">Your Name:</label>
                            <input type="text" id="submitterName" name="submitterName" placeholder= "e.g. Alex Jordan" required>
                        </div>

                        <div class="form-group">
                            <label for="requestEquipment">Equipment Requesting:</label>
                            <input type="text" id="requestEquipment" name="requestEquipment" placeholder="Name of Equipment" required>
                        </div>

                        <div class="form-group">
                            <label for="disciplineType">Discipline Requesting:</label>
                            <input type="text" id="disciplineType" name="disciplineType" placeholder="e.g. PT, OT, SLP, Pedi, etc..." required>
                        </div>

                        <div class="form-group">
                            <label for="equipmentURL">URL or Link to Equipment (Optional):</label>
                            <input type="text" id="equipmentURL" name="equipmentURL" placeholder="https://example.com/product">
                        </div>

                        <div class="form-group">
                            <label for="requestDetails">Justification and Details:</label>
                            <textarea id="requestDetails" name="requestDetails" rows="4" placeholder="Describe the use case, price, etc..." required></textarea>
                        </div>

                        <button type="submit" class="button form-button submit-button">Submit Request</button>
                        <p id="formStatus" class="form-status-message" aria-live="polite"></p> <!-- For success/error messages -->
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="button-container">
                <a href="v2index.html" class="button purple-button">
                    <img src="/will/assets/experimentalicon.svg" alt="Experimental Icon" class="icon">
                    Experimental
                </a>
                <a href="mailto:Wilbert.Liu@memorialhermann.org" class="button pending-button">
                    Contact Me
                </a>
        </div>
    </footer>

    <!--
    scripts.js (initializes requestWishlist.js)
    requestWishlist.js
    firebaseAdapter.js
    dataManager.js
    databaseInterface.js
    collapsibleSections.js
    utils.js
    -->
</body>
</html>
