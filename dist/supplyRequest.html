<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a request for supplies.">
    <title>Supply Request</title>

    <!-- Base Styles -->

    <!-- Component/Page Specific Styles -->
    <!-- Reuse maintenanceRequest.css for list styles or create a dedicated recentItems.css -->
    <!-- Add styles for multi-item form -->
    <style>
        .supply-item-group { margin-bottom: 1rem; }
        .input-with-button { display: flex; gap: 5px; align-items: center; }
        .input-with-button input[type="text"] { flex-grow: 1; }
        .remove-item-btn {
            padding: 5px 10px;
            line-height: 1;
            font-size: 1.2em;
            background-color: var(--danger-background, #5c1a1a);
            color: var(--danger-text, #f1dcdc);
            border: 1px solid var(--danger-border, #a34a4a);
            min-width: 30px;
            flex-shrink: 0; /* Prevent shrinking */
        }
        .remove-item-btn:hover {
             background-color: var(--danger-background-hover, #7d2a2a);
        }
        .add-item-button {
            margin-top: 0.5rem; /* Space above add button */
            margin-bottom: 1rem; /* Space below add button */
            display: block; /* Make it block to control width/margin easily */
            width: fit-content; /* Size to content */
        }
    </style>

    <link rel="icon" href="/will/assets/logo-CWXfw6Fn.png" type="image/png">
    <link rel="manifest" href="/will/assets/manifest-DQDg6Fj5.json">
    <link rel="apple-touch-icon" href="/will/assets/logo-CWXfw6Fn.png">
  <script type="module" crossorigin src="/will/assets/scripts-BD3D_HJ2.js"></script>
  <link rel="stylesheet" crossorigin href="/will/assets/scripts-CxutVWH3.css">
  <link rel="stylesheet" crossorigin href="/will/assets/maintenanceRequest-cbbq0Uze.css">
</head>
<body>
    <header>
        <a href="/will/">
            <img src="/will/assets/logo.svg" alt="Primary Logo" class="logo">
        </a>
        <h2>Supply Request</h2>
    </header>

    <main>
        <section class="recent-requests-section">
            <h2>Recent Supply Requests</h2>
            <!-- Use the specific ID for this list -->
            <div id="recentSupplyRequestsList" class="recent-items-list-container">
                <p>Loading recent supply requests...</p>
            </div>
        </section>

        <section class="request-form-section">
            <div class="collapse-button-container">
                <button class="collapse-button open-form-button" id="toggleOpenFormButton" data-target="openForm">
                    Open Supply Request
                </button>
                <div id="openForm" class="collapse-content">
                    <form id="supplyRequestForm" class="styled-form">
                        <div class="form-group">
                            <label for="submitterName">Your Name:</label>
                            <input type="text" id="submitterName" name="submitterName" required>
                        </div>

                        <!-- Container for dynamic supply item inputs -->
                        <div id="supplyItemsContainer">
                            <!-- Item inputs will be added here by JS -->
                        </div>

                        <button type="button" id="addSupplyItemBtn" class="button secondary-button add-item-button">Add Another Item</button>

                        <div class="form-group">
                            <label for="requestDetails">Optional Details:</label>
                            <textarea id="requestDetails" name="requestDetails" rows="3" placeholder="Add any notes (e.g., urgency, location)"></textarea>
                        </div>

                        <button type="submit" class="button form-button submit-button">Submit Request</button>
                        <p id="formStatus" class="form-status-message" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <!-- Your standard footer content -->
        <div class="button-container">
            <h3>Under Construction</h3>
                <a href="v2index.html" class="button pending-button">
                    <!-- <img src="sheeticon.svg" alt="Spreadsheet Icon" class="icon"> -->
                    Experimental
                </a>
                <a href="mailto:Wilbert.Liu@memorialhermann.org" class="button pending-button">
                    Contact Me
                </a>
        </div>
    </footer>

    <!--
    supplyRequest.js
    ui/recentItemsList.js
    utils/utils.js
    database/firebase/firebaseAdapter.js
    data/dataManager.js
    database/databaseInterface.js
    ui/collapsibleSections.js
    -->
</body>
</html>
