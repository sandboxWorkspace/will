<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a supply request for the Southeast location via Will Clinic Hub.">
    <meta name="application-name" content="Will Clinic Hub">
    <meta name="author" content="Will">
    <meta property="og:title" content="Supply Request — Southeast | Will Clinic Hub">
    <meta property="og:description" content="Request clinic supplies for the Southeast location.">
    <title>Supply Request — Southeast | Will Clinic Hub</title>



    <link rel="icon" href="/will/assets/logo.png" type="image/png">
    <link rel="manifest" href="/will/assets/manifest-jx2tHeoB.json">
    <link rel="apple-touch-icon" href="/will/assets/logo.png">
  <script type="module" crossorigin src="/will/assets/scripts-BMZCuOyy.js"></script>
  <link rel="stylesheet" crossorigin href="/will/assets/scripts-C09BiKd2.css">
  <link rel="stylesheet" crossorigin href="/will/assets/forms-Cw21zwpd.css">
  <link rel="stylesheet" crossorigin href="/will/assets/recentItemsList-OE3pRblK.css">
  <link rel="stylesheet" crossorigin href="/will/assets/dynamicFormItems-BzDiXUi0.css">
</head>
<body>
    <header>
        <a href="/will/">
            <img src="/will/assets/logo.svg" alt="Primary Logo" class="logo">
        </a>
        <span class="location-badge">Southeast</span>
    </header>

    <main>
        <section class="recent-requests-section">
            <h2>Recent Supply Requests</h2>
            <!-- Use the specific ID for this list -->
            <div id="recentSupplyRequestsList" class="recent-items-list-container">
                <p>Loading recent supply requests...</p>
            </div>
        </section>

        <section class="request-form-section">
            <div class="collapse-button-container">
                <button class="collapse-button blue-button" id="toggleOpenFormButton" data-target="openForm">
                    Start Supply Request
                </button>
                <div id="openForm" class="collapse-content">
                    <form id="supplyRequestForm" class="styled-form">
                        <div class="form-group">
                            <label for="submitterName">Your Name:</label>
                            <input type="text" id="submitterName" name="submitterName" placeholder= "e.g. Alex Jordan" required>
                        </div>

                        <!-- Container for dynamic supply item inputs -->
                        <div id="supplyItemsContainer">
                            <!-- Item inputs will be added here by JS -->
                        </div>

                        <button type="button" id="addSupplyItemBtn" class="button secondary-button add-item-button">Add Another Item</button>

                        <div class="form-group">
                            <label for="requestDetails">Optional Details:</label>
                            <textarea id="requestDetails" name="requestDetails" rows="3" placeholder="Add any notes (e.g., urgency, location)"></textarea>
                        </div>

                        <button type="submit" class="button form-button submit-button">Submit Request</button>
                        <p id="formStatus" class="form-status-message" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="button-container">
                <a href="v2index.html" class="button purple-button">
                    <img src="/will/assets/experimentalicon.svg" alt="Experimental Icon" class="icon">
                    Experimental
                </a>
                <a href="mailto:Wilbert.Liu@memorialhermann.org" class="button pending-button">
                    Contact Me
                </a>
        </div>
    </footer>

    <!--
    supplyRequest.js
    ui/recentItemsList.js
    utils/utils.js
    database/firebase/firebaseAdapter.js
    data/dataManager.js
    database/databaseInterface.js
    ui/collapsibleSections.js
    -->
</body>
</html>
