<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Two overlapping cards -->
  <rect x="3" y="5" width="10" height="14" rx="2" fill="none"/>
  <rect x="8" y="7" width="10" height="14" rx="2" fill="none" opacity="0.7"/>
  <!-- Emoji symbol on front card -->
  <text x="16" y="14" font-size="6" text-anchor="middle" fill="currentColor" stroke="none">🐶</text>
  <text x="11" y="10" font-size="5" text-anchor="middle" fill="currentColor" stroke="none" opacity="0.5">🐱</text>
  <!-- Eye -->
  <circle cx="12" cy="6" r="3.5" fill="none"/>
  <circle cx="12" cy="6" r="1.2" fill="currentColor" stroke="none"/>
</svg>
