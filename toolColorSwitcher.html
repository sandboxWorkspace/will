<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <script>(function(){try{var t=localStorage.getItem('hubTheme');var l=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:l}catch(e){document.documentElement.dataset.theme='dark'}})();</script>
    <meta name="description" content="Color Switcher — full-screen color pacer for dot and cone drills. Part of Will Clinic Hub.">
    <meta name="application-name" content="Will Clinic Hub">
    <meta name="author" content="Will">
    <meta property="og:title" content="Color Switcher | Will Clinic Hub">
    <meta property="og:description" content="Full-screen color pacer for dot and cone drills.">
    <title>Color Switcher | Will Clinic Hub</title>


    <link rel="icon" href="/will/assets/logo.png" type="image/png">
    <link rel="manifest" href="/will/assets/manifest-jx2tHeoB.json">
    <link rel="apple-touch-icon" href="/will/assets/logo.png">

    <style>
        /* Color Switcher — page-specific styles (kept in-page per repo convention).
           Full-bleed tool layout: top bar + screens fill the viewport; the run
           screen is a fixed overlay so the drill floods edge-to-edge.
           Chrome uses hub tokens; flood colors live in JS (they are data). */

        #colorSwitcher {
            /* Map hub tokens onto the app's var names */
            --bg: var(--background-color);
            --surface: var(--background-surface);
            --text: var(--text-primary);
            --text-heading: var(--text-emphasis);
            --border: var(--border-color);
            --border-light: var(--border-color-light);
            --accent: var(--primary-color);
            --danger: var(--error-text);
            --success: var(--success-border);
            --blank: var(--background-color);

            /* Fluid tokens */
            --space-xs: clamp(4px, 1vw, 8px);
            --space-s: clamp(6px, 1.6vw, 12px);
            --space-m: clamp(10px, 2.5vw, 16px);
            --space-l: clamp(14px, 3.5vw, 24px);
            --font-xs: clamp(0.7rem, 0.62rem + 0.3vw, 0.78rem);
            --font-s: clamp(0.8rem, 0.7rem + 0.5vw, 0.9rem);
            --font-m: clamp(0.92rem, 0.78rem + 0.7vw, 1.05rem);
            --font-l: clamp(1.05rem, 0.9rem + 1vw, 1.25rem);
            --touch-min: 44px;
            --radius: 10px;
        }

        html, body { height: 100%; }
        body {
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        #colorSwitcher {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            max-width: none;
            height: 100vh;
            height: 100dvh;
            margin: 0;
        }
        #colorSwitcher button { font-family: inherit; touch-action: manipulation; }

        /* ── Top bar (back + title + theme toggle) ─────────── */
        #csTopBar {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
            background: var(--background-color); /* opaque — iOS toolbars can't bleed through */
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
        }
        #csBackBtn {
            justify-self: start;
            text-decoration: none;
            font-size: 1.5rem;
            line-height: 1;
            color: var(--text-secondary);
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius);
            transition: background-color 0.15s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #csBackBtn:hover { background: var(--background-alt); color: var(--text-primary); }
        #csBackBtn:active { opacity: 0.6; }
        .cs-title {
            margin: 0;
            font-size: clamp(1.05rem, 0.95rem + 0.8vw, 1.4rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(138deg, var(--primary-color), var(--primary-color-dark));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #csTopBar .switch { justify-self: end; }

        /* ── Screens ── */
        #colorSwitcher .screen { display: none; }
        #colorSwitcher .screen.active {
            display: flex; flex-direction: column;
            flex: 1 1 auto; min-height: 0;
        }

        /* ══ SETUP SCREEN ══ */
        #setupScreen { overflow: hidden; }
        .wiz-body {
            flex: 1; min-height: 0; overflow-y: auto;
            width: 100%; max-width: 640px; margin: 0 auto;
            padding: var(--space-m) var(--space-m) var(--space-l);
            display: flex; flex-direction: column;
        }
        .wiz-foot {
            width: 100%; max-width: 640px; margin: 0 auto;
            display: flex; flex-direction: column; gap: var(--space-s);
            padding: var(--space-s) var(--space-m) calc(var(--space-s) + env(safe-area-inset-bottom));
        }
        .wiz-foot .btn { width: 100%; min-height: 52px; font-size: var(--font-m); }
        .step { display: none; width: 100%; }
        .step.active { display: block; margin: auto 0; animation: step-in 0.18s ease; }
        @keyframes step-in {
            from { opacity: 0; transform: translateX(14px); }
            to { opacity: 1; transform: none; }
        }

        .group { width: 100%; max-width: 520px; margin-left: auto; margin-right: auto; }
        .group + .group { margin-top: calc(var(--space-l) + var(--space-s)); }
        .group .label { margin-bottom: var(--space-xs); text-align: center; }
        .summary-line {
            text-align: center; font-size: var(--font-s); color: var(--text-subtle);
            font-variant-numeric: tabular-nums; padding: var(--space-s) 0;
        }
        .add-chip { border-style: dashed; color: var(--text-subtle); }
        .wrap {
            width: 100%; max-width: 640px;
            padding: 0 var(--space-m) calc(var(--space-l) + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: var(--space-m);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--space-m);
        }
        .label {
            display: block;
            font-size: var(--font-xs); font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--text-subtle);
            margin-bottom: var(--space-s);
        }
        .hint { font-size: var(--font-xs); color: var(--text-subtle); margin-top: var(--space-s); line-height: 1.4; }

        /* ── Color chips ── */
        .chips { display: flex; flex-wrap: wrap; gap: var(--space-s); justify-content: center; }
        .chip { position: relative; }
        .chip {
            display: inline-flex; align-items: center; gap: 10px;
            min-height: 48px;
            padding: 8px 16px 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-subtle);
            font-size: var(--font-s);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
            user-select: none;
        }
        .chip .dot {
            width: 18px; height: 18px; border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.25);
            flex-shrink: 0;
        }
        .chip.on {
            border-color: var(--accent);
            background: var(--surface-hover);
            color: var(--text);
            font-weight: 600;
        }
        .chip .x {
            border: none; background: transparent; color: var(--text-subtle);
            font-size: 0.9rem; line-height: 1; padding: 4px 0 4px 4px;
            cursor: pointer; min-width: 24px; min-height: 24px;
        }
        .custom-row { display: none; flex-wrap: wrap; gap: var(--space-s); margin-top: var(--space-s); align-items: center; justify-content: center; }
        .custom-row.open { display: flex; }
        .custom-row input[type="color"] {
            width: 56px; height: var(--touch-min);
            border: 1.5px solid var(--border); border-radius: 8px;
            background: var(--surface); padding: 4px; cursor: pointer;
        }
        .custom-row input[type="text"] {
            flex: 1; min-width: 120px; height: var(--touch-min);
            padding: 0 12px; border: 1.5px solid var(--border); border-radius: 8px;
            background: var(--surface); color: var(--text); font-size: var(--font-s);
            outline: none;
        }
        .custom-row input[type="text"]:focus { border-color: var(--accent); }

        /* ── Segmented pills ── */
        .pill-group {
            display: flex; border: 1.5px solid var(--border);
            border-radius: var(--radius); overflow: hidden; background: var(--surface);
        }
        .pill-btn {
            flex: 1; min-height: var(--touch-min);
            border: none; background: transparent; color: var(--text-subtle);
            font-size: var(--font-s); cursor: pointer; padding: 0 var(--space-s);
            transition: background 0.15s, color 0.15s;
        }
        .pill-btn + .pill-btn { border-left: 1px solid var(--border); }
        .pill-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
        .stepper { display: flex; align-items: center; justify-content: center; gap: var(--space-m); margin-top: var(--space-s); }
        .stepper button {
            width: var(--touch-min); height: var(--touch-min); border-radius: 50%;
            border: 1.5px solid var(--border-light); background: var(--surface);
            color: var(--text); font-size: var(--font-l); font-weight: 700; cursor: pointer;
        }
        .stepper .val {
            font-size: var(--font-l); font-weight: 800; color: var(--text-heading);
            min-width: 64px; text-align: center; font-variant-numeric: tabular-nums;
        }

        /* ── Sequence editor ── */
        .seq-list { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-s); justify-content: center; align-items: center; }
        .seq-chip {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px 8px 14px; border-radius: 999px;
            border: 1.5px solid var(--border-light);
            background: var(--surface); color: var(--text);
            font-size: var(--font-s); cursor: pointer;
            min-height: 44px; user-select: none;
        }
        .seq-chip .dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); }
        .seq-arrow { color: var(--text-subtle); font-size: var(--font-m); font-weight: 700; }
        .seq-empty { font-size: var(--font-s); color: var(--text-subtle); font-style: italic; margin-top: var(--space-s); }
        .loop-badge {
            display: inline-block; margin-left: var(--space-s);
            font-size: var(--font-xs); color: var(--text-subtle);
        }

        /* ── Input indicators ── */
        .indicators { display: flex; gap: var(--space-s); flex-wrap: wrap; justify-content: center; }
        .ind {
            flex: 1; min-width: 90px; text-align: center;
            padding: 10px var(--space-s); min-height: var(--touch-min);
            border: 1.5px solid var(--border); border-radius: var(--radius);
            background: var(--surface); color: var(--text-subtle);
            font-size: var(--font-s);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            transition: border-color 0.12s, color 0.12s, box-shadow 0.12s;
        }
        .ind.lit {
            border-color: var(--success); color: var(--text);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
        }

        /* ── Speak toggle ── */
        .icon-btn {
            display: flex; align-items: center; justify-content: center;
            width: 52px; height: 52px; margin: var(--space-l) auto 0;
            border-radius: 50%; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-subtle);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: color 120ms, border-color 120ms;
        }
        .icon-btn svg { width: 24px; height: 24px; }
        .icon-btn .ico-on { display: none; }
        .icon-btn.on { color: var(--accent); border-color: var(--accent); }
        .icon-btn.on .ico-on { display: block; }
        .icon-btn.on .ico-off { display: none; }


        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 48px; padding: 0 var(--space-l);
            border-radius: var(--radius); border: 1.5px solid var(--border-light);
            background: var(--surface); color: var(--text);
            font-size: var(--font-m); font-weight: 600; cursor: pointer;
            transition: transform 0.1s, opacity 0.15s;
            user-select: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: var(--accent-strong); border-color: var(--accent-strong);
            color: #fff; width: 100%; min-height: 56px; font-size: var(--font-l);
        }
        .btn-primary:disabled { opacity: 0.45; cursor: default; }
        .btn-ghost { background: transparent; }
        .btn-row { display: flex; gap: var(--space-s); }
        .btn-row .btn { flex: 1; }
        .link-btn {
            border: none; background: transparent; color: var(--text-subtle);
            font-size: var(--font-s); text-decoration: underline; cursor: pointer;
            min-height: var(--touch-min); padding: 0 var(--space-s);
        }
        #setupMsg { font-size: var(--font-s); color: var(--danger); min-height: 18px; text-align: center; }
        .mvp-note { text-align: center; font-size: var(--font-xs); color: var(--text-subtle); padding: var(--space-s) 0; }

        /* ══ RUN SCREEN ══ */
        #runScreen {
            position: fixed; inset: 0; z-index: 40;
            touch-action: none; user-select: none;
            overscroll-behavior: none;
            background: var(--blank);
            transition: background-color 110ms ease-out, box-shadow 90ms ease-out;
            display: none;
            align-items: center; justify-content: center;
            -webkit-touch-callout: none;
        }
        #runScreen.active { display: flex; }
        #nameOverlay {
            font-size: clamp(2.5rem, 14vw, 7rem);
            font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
            text-align: center; padding: 0 var(--space-m);
            line-height: 1.05; pointer-events: none;
            color: #fff;
            text-shadow: 0 2px 14px rgba(0,0,0,0.35);
        }
        #countdown {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(5rem, 40vw, 14rem); font-weight: 800;
            color: var(--text-subtle); pointer-events: none;
        }
        #hud {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));
            background: rgba(0,0,0,0.6); color: #fff;
            font-size: var(--font-xs); font-variant-numeric: tabular-nums;
            padding: 6px 10px; border-radius: 8px;
            pointer-events: none;
        }
        #runScreen.ack { box-shadow: inset 0 0 0 8px rgba(255,255,255,0.12); }
        #endRunBtn {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
            min-height: var(--touch-min);
            padding: 0 14px; border-radius: 999px;
            border: none; background: rgba(0,0,0,0.6); color: #fff;
            font-size: var(--font-s); font-weight: 600; cursor: pointer;
        }
        #timerRingWrap {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
            width: 96px; height: 96px; pointer-events: none;
        }
        #timerRing { width: 100%; height: 100%; display: block; }
        .ring-disc { fill: rgba(0,0,0,0.6); }
        .ring-track { fill: none; stroke: rgba(255,255,255,0.25); stroke-width: 6; }
        .ring-fg {
            fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round;
            stroke-dasharray: 251.327;
            transition: stroke-dashoffset 0.2s linear;
        }
        #timer {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 0.72rem; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .range-row { display: flex; align-items: center; gap: var(--space-s); margin-top: var(--space-s); }
        .range-row input[type="range"] { flex: 1; accent-color: var(--accent); height: 32px; }
        .range-val {
            min-width: 52px; text-align: right;
            font-size: var(--font-s); font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .stepper button:disabled { opacity: 0.35; }

        /* ══ MENUS ══ */
        #pauseMenu, #leaveMenu {
            position: fixed; inset: 0; z-index: 50;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55); padding: var(--space-l);
        }
        #pauseMenu.active, #leaveMenu.active { display: flex; }
        .menu-card {
            width: 100%; max-width: 320px;
            background: var(--card-bg); border-radius: 16px;
            padding: var(--space-l); display: flex; flex-direction: column; gap: var(--space-s);
            box-shadow: 0 8px 40px rgba(0,0,0,0.35);
        }
        .menu-card h2 { margin: 0 0 var(--space-xs); font-size: var(--font-l); text-align: center; }

        /* ── Focus & accessibility ── */
        #colorSwitcher button:focus-visible,
        #colorSwitcher a:focus-visible,
        #colorSwitcher input:not([type="checkbox"]):focus-visible,
        #colorSwitcher textarea:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        #colorSwitcher .switch input:focus-visible + .slider {
            box-shadow: 0 0 0 3px var(--accent);
        }
        .visually-hidden {
            position: absolute; width: 1px; height: 1px;
            margin: -1px; padding: 0; border: 0;
            clip: rect(0 0 0 0); clip-path: inset(50%);
            overflow: hidden; white-space: nowrap;
        }
        @media (prefers-reduced-motion: reduce) {
            #colorSwitcher *, #colorSwitcher *::before, #colorSwitcher *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ══ RESULTS ══ */
        #resultsScreen { align-items: center; overflow-y: auto; }
        #resultsScreen .wrap { padding-top: var(--space-l); }
        #resultsScreen h1 { margin: 0; font-size: var(--font-l); padding-top: var(--space-s); }
        .stat-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: var(--space-s);
        }
        .stat {
            background: var(--card-bg); border: 1.5px solid var(--border);
            border-radius: 12px; padding: var(--space-s) var(--space-m);
            text-align: center; font-size: var(--font-xs); color: var(--text-subtle);
        }
        .stat .num {
            display: block; font-size: clamp(1.4rem, 1.2rem + 1vw, 1.8rem);
            font-weight: 800; color: var(--accent); margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        .color-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-s); padding: 10px 0; font-size: var(--font-s);
        }
        .color-row + .color-row { border-top: 1px solid var(--border); }
        .color-row .swatch {
            display: inline-flex; align-items: center; gap: 8px;
        }
        .color-row .dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); }
        .color-row .med { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
        #summaryText {
            width: 100%; min-height: 130px; resize: vertical;
            background: var(--surface); color: var(--text);
            border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: var(--space-s); font-size: var(--font-s); font-family: ui-monospace, Menlo, Consolas, monospace;
            line-height: 1.5;
        }
    </style>

<body>
    <main id="colorSwitcher">
        <!-- TOP BAR -->
        <div id="csTopBar">
            <a id="csBackBtn" href="/will/" aria-label="Back to hub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            </a>
            <h1 class="cs-title">Color Switcher</h1>
            <label class="switch theme-switch">
                <input type="checkbox" id="themeToggleInput" aria-label="Toggle dark theme">
                <span class="slider round"></span>
            </label>
        </div>

        <!-- ══ SETUP ══ -->
        <div id="setupScreen" class="screen active">
            <div class="wiz-body">
                <section class="step active">
                    <div id="paletteChips" class="chips"></div>
                    <div id="customRow" class="custom-row">
                        <input type="color" id="customColorInput" value="#8B5CF6" aria-label="Custom color">
                        <input type="text" id="customLabelInput" placeholder="Label (optional, ≤12)" maxlength="12" autocomplete="off" aria-label="Custom color label">
                        <button id="addCustomBtn" class="btn btn-ghost" type="button">Add</button>
                    </div>
                    <div class="group">
                        <span class="label">Timing</span>
                        <div class="pill-group" id="timingPills" role="group" aria-label="Timing">
                            <button class="pill-btn" data-timing="manual" type="button">Manual</button>
                            <button class="pill-btn" data-timing="pace" type="button">Auto advance</button>
                        </div>
                        <div id="paceRow" style="display:none;">
                            <div class="range-row">
                                <input type="range" id="paceSlider" min="1000" max="10000" step="500" aria-label="Auto advance interval">
                                <span id="paceVal" class="range-val">3s</span>
                            </div>
                        </div>
                    </div>
                    <div class="group">
                        <span class="label">Order</span>
                        <div class="pill-group" id="orderPills" role="group" aria-label="Order">
                            <button class="pill-btn" data-order="random" type="button">Random</button>
                            <button class="pill-btn" data-order="sequence" type="button">Sequence</button>
                        </div>
                        <div id="sequenceSection" style="display:none; margin-top: var(--space-m);">
                            <span class="label" style="margin-bottom: var(--space-xs);">Sequence</span>
                            <div id="sequenceAdd" class="chips"></div>
                            <div id="sequenceList" class="seq-list"></div>
                            <div id="sequenceEmpty" class="seq-empty">Tap to add</div>
                        </div>
                    </div>
                    <div class="group">
                        <span class="label">Length</span>
                        <div class="pill-group" id="endPills" role="group" aria-label="Length">
                            <button class="pill-btn" data-end="open" type="button">Open</button>
                            <button class="pill-btn" data-end="time" type="button">Time</button>
                            <button class="pill-btn" data-end="reps" type="button">Reps</button>
                            <button class="pill-btn" data-end="either" type="button">Either</button>
                        </div>
                        <div id="timeRow" style="display:none;">
                            <div class="pill-group" id="timePills" role="group" aria-label="Time limit" style="margin-top: var(--space-s);">
                                <button class="pill-btn" data-ms="30000" type="button">30s</button>
                                <button class="pill-btn" data-ms="60000" type="button">1m</button>
                                <button class="pill-btn" data-ms="120000" type="button">2m</button>
                                <button class="pill-btn" data-ms="300000" type="button">5m</button>
                                <button class="pill-btn" data-ms="600000" type="button">10m</button>
                            </div>
                            <div class="range-row">
                                <input type="range" id="timeSlider" min="15000" max="1800000" step="15000" aria-label="Custom time limit">
                                <span id="timeVal" class="range-val">1:00</span>
                            </div>
                        </div>
                        <div id="repsRow" style="display:none;">
                            <div class="stepper">
                                <button id="repsMinus" type="button" aria-label="Fewer reps">−</button>
                                <span id="repsVal" class="val">20</span>
                                <button id="repsPlus" type="button" aria-label="More reps">+</button>
                            </div>
                            <div class="range-row">
                                <input type="range" id="repsSlider" min="1" max="200" step="1" aria-label="Custom rep target">
                            </div>
                        </div>
                        <div id="passesRow" style="display:none;">
                            <span class="label" style="margin-top: var(--space-m);">Passes <span class="loop-badge">then ends</span></span>
                            <div class="pill-group" id="passesPills" role="group" aria-label="Passes">
                                <button class="pill-btn" data-passes="1" type="button">1</button>
                                <button class="pill-btn" data-passes="2" type="button">2</button>
                                <button class="pill-btn" data-passes="3" type="button">3</button>
                                <button class="pill-btn" data-passes="0" type="button">∞</button>
                            </div>
                        </div>
                    </div>
                    <button id="speakBtn" class="icon-btn" type="button" aria-pressed="false" aria-label="Unmute color names">
                        <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                        <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
                    </button>
                    <div class="group">
                        <span class="label">Test inputs</span>
                        <div class="indicators">
                            <span class="ind" id="indTap">Tap / Click</span>
                            <span class="ind" id="indKey">Key / Clicker</span>
                            <span class="ind" id="indPad">Gamepad</span>
                        </div>
                    </div>
                    <div class="summary-line" id="summaryLine"></div>
                    <button id="resetBtn" class="link-btn" type="button" style="display:block; margin:0 auto;">↺ Reset</button>
                    <p class="mvp-note">Hold to pause · ✕ ends · Experimental</p>
                </section>

                <!--
                    ════════════════════════════════════════════════════════════
                    WIREFRAME ONLY — future config ideas, not built, not rendered
                    (styled to match existing .group / .pill-group / .chips blocks)
                    ════════════════════════════════════════════════════════════

                    <div class="group">
                        <span class="label">Pace presets</span>
                        <div class="pill-group">
                            <button>Slow (4 s)</button><button>Medium (3 s)</button><button>Fast (2 s)</button>
                        </div>
                    </div>

                    <div class="group">
                        <span class="label">Timing extras</span>
                        <div class="range-row">blank gap slider · 150–400 ms</div>
                        <div class="toggle-row">countdown beep before each change</div>
                        <div class="toggle-row">skip 3-2-1 countdown</div>
                    </div>

                    <div class="group">
                        <span class="label">Saved color sets</span>
                        <div class="chips">save palette + sequence as a named set · load / delete sets</div>
                    </div>

                    <div class="group">
                        <span class="label">Feedback</span>
                        <div class="toggle-row">vibrate on color change (Android)</div>
                        <div class="toggle-row">pause chip on run screen (one-tap pause)</div>
                        <div class="toggle-row">dual-color trials (two colors per stimulus)</div>
                    </div>

                    <div class="group">
                        <span class="label">History &amp; export</span>
                        <div class="toggle-row">recent sessions list (last 10)</div>
                        <div class="toggle-row">CSV export / share sheet</div>
                        <div class="toggle-row">reaction-time baseline chart across sessions</div>
                    </div>

                    <div class="group">
                        <span class="label">Offline</span>
                        <div class="toggle-row">service worker — run without network</div>
                    </div>
                    ══════════════ end wireframe ══════════════
                -->
            </div>
            <div class="wiz-foot">
                <p id="setupMsg"></p>
                <button id="startBtn" class="btn btn-primary" type="button">Start</button>
            </div>
        </div>

        <!-- ══ RUN ══ -->
        <div id="runScreen">
            <div id="nameOverlay"></div>
            <div id="countdown" style="display:none;"></div>
            <div id="hud" style="display:none;"></div>
            <button id="endRunBtn" type="button">✕ End</button>
            <div id="timerRingWrap" style="display:none;">
                <svg id="timerRing" viewBox="0 0 100 100" aria-hidden="true">
                    <circle class="ring-disc" cx="50" cy="50" r="49"></circle>
                    <circle class="ring-track" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"></circle>
                    <circle id="ringProgress" class="ring-fg" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"></circle>
                </svg>
                <div id="timer">0:00/0:00</div>
            </div>
        </div>

        <!-- ══ PAUSE MENU ══ -->
        <div id="pauseMenu" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
            <div class="menu-card">
                <h2 id="pauseTitle">Paused</h2>
                <button id="resumeBtn" class="btn btn-primary" type="button">Resume</button>
                <button id="restartBtn" class="btn btn-ghost" type="button">Restart session</button>
                <div class="btn-row">
                    <button id="endBtn" class="btn btn-ghost" type="button">End</button>
                    <button id="settingsBtn" class="btn btn-ghost" type="button">Exit to setup</button>
                </div>
            </div>
        </div>

        <!-- ══ LEAVE CONFIRM ══ -->
        <div id="leaveMenu" role="dialog" aria-modal="true" aria-labelledby="leaveTitle">
            <div class="menu-card">
                <h2 id="leaveTitle">Leave drill?</h2>
                <div class="btn-row">
                    <button id="leaveCancelBtn" class="btn btn-primary" type="button">Keep drilling</button>
                    <button id="leaveConfirmBtn" class="btn btn-ghost" type="button">Leave</button>
                </div>
            </div>
        </div>

        <!-- ══ RESULTS ══ -->
        <div id="resultsScreen" class="screen">
            <div class="wrap">
                <h1>Session Summary</h1>
                <div id="statsGrid" class="stat-grid"></div>
                <div id="perColorList" class="card"></div>
                <div class="card">
                    <span class="label">Copy summary</span>
                    <textarea id="summaryText" readonly></textarea>
                    <div class="btn-row" style="margin-top: var(--space-s);">
                        <button id="copyBtn" class="btn" type="button">Copy</button>
                        <span id="copyStatus" role="status" class="visually-hidden"></span>
                    </div>
                </div>
                <div class="btn-row">
                    <button id="playAgainBtn" class="btn btn-primary" type="button">▶ Go again</button>
                    <button id="backSetupBtn" class="btn btn-ghost" type="button">⚙ Reconfigure</button>
                </div>
            </div>
        </div>
    </main>

    <script>
    (function() {
        var from = new URLSearchParams(location.search).get('from');
        if (from) {
            var link = document.getElementById('csBackBtn');
            if (link) link.href = from === 'moursund' ? '/will/moursund.html' : '/will/';
        }
    })();
    </script>
</body>
</html>
