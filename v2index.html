<!DOCTYPE html>

    <main>

        <div class="collapse-button-container">

                    Maintenance & Repair
                </a>
            </div>
        </div>
        <div class="collapse-button-container">
            <button class="collapse-button logs-button" id="toggleSafetyLogsButton" data-target="safetyLogs">
                Safety Logs
            </button>
            <div id="safetyLogs" class="collapse-content">
                <a href="logs.html" class="button form-button">
                    <img src="/assets/formicon.svg" alt="Form Icon" class="icon">
                    Submit Logs
                </a>
