<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate QR codes for clinic equipment labels, resource links, and therapy tools. Part of Will Clinic Hub.">
    <meta name="application-name" content="Will Clinic Hub">
    <meta name="author" content="Will">
    <meta property="og:title" content="QR Code Generator | Will Clinic Hub">
    <meta property="og:description" content="Generate QR codes for clinic equipment and resource labels.">
    <title>QR Code Generator | Will Clinic Hub</title>
    

    
    <link rel="icon" href="/will/assets/logo.png" type="image/png">
    <link rel="manifest" href="/will/assets/manifest-jx2tHeoB.json">
    <link rel="apple-touch-icon" href="/will/assets/logo.png">
  <script type="module" crossorigin src="/will/assets/toolQRGenerator-t9QVSSve.js"></script>
  <link rel="modulepreload" crossorigin href="/will/assets/scripts-d3BtnBGw.js">
  <link rel="modulepreload" crossorigin href="/will/assets/utils-DL4mckC_.js">
  <link rel="modulepreload" crossorigin href="/will/assets/browser-BtZzEF0O.js">
  <link rel="stylesheet" crossorigin href="/will/assets/scripts-DBH1DUSb.css">
  <link rel="stylesheet" crossorigin href="/will/assets/toolQRGenerator-D-lFGv3h.css">
  <link rel="stylesheet" crossorigin href="/will/assets/scrollbar-B5V2Wh3s.css">
  <link rel="stylesheet" crossorigin href="/will/assets/forms-Cw21zwpd.css">
  <link rel="stylesheet" crossorigin href="/will/assets/toggleSwitch-BrWqXYZC.css">
</head>
<body>
    <header>
        <a href="/will/">
            <img src="/will/assets/logo.svg" alt="Primary Logo" class="logo">
        </a>
        <h2>QR Code Generator</h2>
    </header>

    <main>
        <div class="styled-form" type="text">
            <textarea id="qrData" placeholder="Enter, paste, drag & drop URL/text here..."></textarea>
        </div>
        <div id="qrCodeContainer">
            <!-- QR Code will be rendered here by qrcode.js -->
        </div>        
        <div class="qr-controls">
            <div class="color-toggle-container">
                <span class="toggle-label">WoB</span> <!-- White on Black -->
                <label class="switch">
                    <input type="checkbox" id="colorToggleSwitch" checked>
                    <span class="slider round"></span>
                </label>
                <span class="toggle-label">BoW</span> <!-- Black on White -->
            </div>
            <button id="downloadPNGBtn" class="button green-button">
                <img src="/will/assets/downloadicon.svg" alt="Download Icon" class="icon">
                Download PNG
            </button>
            </div>
    </main>
    
    <footer>
        <div class="button-container">
            <a href="v2index.html" class="button purple-button">
                <img src="/will/assets/experimentalicon.svg" alt="Experimental Icon" class="icon">
                Experimental
            </a>
            <a href="mailto:Wilbert.Liu@memorialhermann.org" class="button pending-button">Contact Me</a>
        </div>
    </footer>

</body>
</html>
