<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will_QRCode</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/logo.svg">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="assets/logo.svg" alt="Primary Logo" class="logo">
        </a>
        <h2>XCite Bike Sign Up</h2>
    </header>

    <!-- Button to trigger changelog modal -->
    <button id="openChangelogBtn" class="changelog-button">Change Log</button>

    <!-- Table for displaying the schedule (This will be dynamically populated) -->
    <table id="schedule-table">
        <thead>
            <tr>
                <th>Time</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
        </thead>
        <tbody>
            <!-- Table rows will be generated dynamically here -->
        </tbody>
    </table>

    <!-- Confirmation Modal for editing a cell -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h4>Change this sign up?</h4>
            <div class="modal-buttons">
                <button id="confirmBtn" class="yes-button">Yes</button>
                <button id="cancelBtn" class="no-button">No</button>
            </div>
        </div>
    </div>
    
    <!-- Changelog Modal -->
    <div id="changelogModal" class="modal">
        <div class="modal-content">
            <h4>Change Log</h4>
            <div id="changelogList" class="changelog-list">
                <!-- Changelog items will be dynamically populated here -->
            </div>
            <button id="closeChangelogBtn" class="changelog-button">Close</button>
        </div>
    </div>

    <!-- External scripts -->
    <script src="animations.js"></script>
    <script type="module" src="firebaseScripts.js"></script>
    <script type="module" src="scripts.js"></script>
</body>

<div>
    <footer>
        <div class="button-container">
            <h3>Under Construction</h3>
            <a href="mailto:Wilbert.Liu@memorialhermann.org" class="button pending-button">
                Contact Me
            </a>
            <a href="pending.html" class="button pending-button">
                Pending Changes
            </a>
        </div>
    </footer>
</div>
</html>
