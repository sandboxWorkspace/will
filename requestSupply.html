<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a request for supplies.">
    <title>Supply Request</title>

    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/buttons.css">
    <link rel="stylesheet" href="/src/css/scrollbar.css">
    <link rel="stylesheet" href="/src/css/responsive.css">

    <link rel="stylesheet" href="/src/css/forms.css">
    <link rel="stylesheet" href="/src/css/recentItemsList.css">
    <link rel="stylesheet" href="/src/css/dynamicFormItems.css">

    <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/logo.png">
</head>
<body>
    <header>
        <a href="/will/">
            <img src="/assets/logo.svg" alt="Primary Logo" class="logo">
        </a>
        <h2>Supply Request</h2>
    </header>

    <main>
        <section class="recent-requests-section">
            <h2>Recent Supply Requests</h2>
            <!-- Use the specific ID for this list -->
            <div id="recentSupplyRequestsList" class="recent-items-list-container">
                <p>Loading recent supply requests...</p>
            </div>
        </section>

        <section class="request-form-section">
            <div class="collapse-button-container">
                <button class="collapse-button open-form-button" id="toggleOpenFormButton" data-target="openForm">
                    Start Supply Request
                </button>
                <div id="openForm" class="collapse-content">
                    <form id="supplyRequestForm" class="styled-form">
                        <div class="form-group">
                            <label for="submitterName">Your Name:</label>
                            <input type="text" id="submitterName" name="submitterName" required>
                        </div>

                        <!-- Container for dynamic supply item inputs -->
                        <div id="supplyItemsContainer">
                            <!-- Item inputs will be added here by JS -->
                        </div>

                        <button type="button" id="addSupplyItemBtn" class="button secondary-button add-item-button">Add Another Item</button>

                        <div class="form-group">
                            <label for="requestDetails">Optional Details:</label>
                            <textarea id="requestDetails" name="requestDetails" rows="3" placeholder="Add any notes (e.g., urgency, location)"></textarea>
                        </div>

                        <button type="submit" class="button form-button submit-button">Submit Request</button>
                        <p id="formStatus" class="form-status-message" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="button-container">
            <h3>Under Construction</h3>
                <a href="v2index.html" class="button pending-button">
                    <!-- <img src="sheeticon.svg" alt="Spreadsheet Icon" class="icon"> -->
                    Experimental
                </a>
                <a href="mailto:Wilbert.Liu@memorialhermann.org" class="button pending-button">
                    Contact Me
                </a>
        </div>
    </footer>

    <script type="module" src="/src/scripts.js"></script>
    <!--
    supplyRequest.js
    ui/recentItemsList.js
    utils/utils.js
    database/firebase/firebaseAdapter.js
    data/dataManager.js
    database/databaseInterface.js
    ui/collapsibleSections.js
    -->
</body>
</html>
